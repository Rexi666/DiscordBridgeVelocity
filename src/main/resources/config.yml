# Discord bot token
token: "DISCORD_BOT_TOKEN"

# Discord bot status
statusMode: ONLINE # Valid Modes: ONLINE, IDLE, DND, INVISIBLE"
statusType: WATCHING # Valid Types: PLAYING, LISTENING, WATCHING, COMPETING, NONE
statusText: "My Velocity Bot"

database:
  type: SQLITE # Valid types: SQLITE, MYSQL
  sqlite-file: "database.db"
  mysql:
    host: localhost
    port: 3306
    database: discordbridge
    username: user
    password: pass

link:
  guild-id: "123456789123456789" # Replace with your guild ID (Server ID)
  change_discord_name: false # Change Discord nickname to in-game username upon linking
  give_role: # Give a role upon linking
    enabled: false
    role_id: "123456789123456789" # Replace with your role ID
  luckperms:
    enabled: false # Enable LuckPerms integration
    sync_interval:
      enabled: true # Enable periodic role sync
      interval: 6 # Interval in hours to sync roles
    roles:
      vip: # LuckPerms group to assign role for
        discord_role: "123456789123456789" # Replace with your Discord role ID
      mvp:
        discord_role: "987654321987654321"
  discord_ranks_rewards:
    enabled: false
    daily_hour: 12 # Hour of the day (0-23) to give daily rewards
    roles:
      "123456789123456789": # example with Booster role ID
        received_commands: # command executed when someone receive the discord role
          - "lpv user {player} parent add booster"
        removed_commands: # command executed when someone lose the discord role
          - "lpv user {player} parent remove booster"
        daily_rewards: # commands executed daily to give rewards
          - "serverexecute survival eco give {player} 1000" # This is a command from VelocityUtils that runs a command on a specific server (in this example survival)

unlink:
  enabled: true # Can players unlink their accounts?
  require_code: true # Require security code to unlink

admin_commands:
  allowed_roles: # Leave blank to only allow server admins. allowed_roles: []
    - "123456789123456789" # Replace with your admin role IDs
    - "987654321987654321"

messaging:
  enabled: false
  litebans: false # Enable it to prevent banned/muted players from sending messages. Requires litebans to be installed
  channels:
    survival:
      channel_id: "123456789123456789" # Channel ID for survival server messages
    skywars:
      channel_id: "987654321987654321" # Channel ID for skywars server messages

velocity_utils_commands: # Need to have VelocityUtils plugin installed
  enabled: false
  alert: # Admins can use /alert <amount> <message> to send an alert to all players on the velocity network
    enabled: true
  stafflist: # Admins can use /stafflist to see online staff members
    enabled: true
  vlist: # Admins can use /vlist to see every online player
    enabled: true
  staffchat: # Admins can use /staffchat to send a message to the minecraft staff chat. They need to be linked
    enabled: true
  adminchat: # Admins can use /adminchat to send a message to the minecraft admin chat. They need to be linked
    enabled: true

discord_messages:
  link-message:
    title: "🔗 Link Your Account"
    color: D600CB # HEX COLOR
    message:
      - "**Link your Discord account with your in-game account!**"
      - ""
      - "1. Join the Minecraft Server: www.example.com"
      - "2. Run the command: `/link {code}` in-game"
      - ""
      - "**This link code will expire in 5 minutes.**"
  dm: "✅ Message sent via DM."
  dm-error:
    title: "⚠️ Unable to send DM"
    color: FA0000
    message: "Please, enable your DMs to receive messages from the bot."
  already-linked:
    title: "⚠️ Account Already Linked"
    color: FA0000
    message: "Your Discord account is already linked with an in-game account: {username}"
  link-successfully:
    title: "You have successfully linked your account!"
    color: 08C702
    message:
      - "**You have successfully linked your account!**"
      - ""
      - "Your in-game username: `{username}`"
      - "Recovery Code: `{recovery_code}`"
      - ""
      - "**Save this code to make changes to the link**"
      - "**Do not share it with ANYONE**"
  info-not-linked:
    title: "⚠️ Account Not Linked"
    color: FA0000
    message:
      - "Your Discord account is not linked with any in-game account."
      - "To link your account, use `/link`"
  info:
    title: "🔗 Linked Account Information"
    color: D600CB
    message:
      - "**Your Discord account is linked with the following in-game account:**"
      - ""
      - "Username: `{username}`"
  userinfo:
    title: "👤 User Information"
    color: D600CB
    message:
      - "**User Information:**"
      - ""
      - "Discord Tag: {discord_tag}"
      - "Discord ID: `{discord_id}`"
      - "In-Game Username: `{username}`"
      - "In-Game UUID: `{uuid}`"
      - "Link Date: {link_date}"
      - "Recovery Code: `{recovery_code}`"
  userinfo_no_linked:
    title: "👤 User Information"
    color: FA0000
    message:
      - "**User Information:**"
      - ""
      - "Discord Tag: {discord_tag}"
      - "Discord ID: `{discord_id}`"
      - ""
      - "⚠️ Account Not Linked"
  forceunlink_confirm:
    title: "⚠️ Confirm Unlink"
    color: DBB000
    message: "Are you sure you want to unlink the Discord account {userId} from Minecraft player `{username}`?"
    message_successful: "✅ Successfully unlinked Discord account {userId} from Minecraft player `{username}`."
    message_cancelled: "❌ Unlinking process cancelled."
  unlink_confirm:
    title: "⚠️ Confirm Unlink"
    color: DBB000
    message: "Are you sure you want to unlink your Minecraft account `{username}`?"
  dm-unlinked:
    title: "✅ Account Unlinked"
    color: 08C702
    message:
      - "**Your Minecraft account has been unlinked from your Discord account.**"
      - ""
      - "If you wish to link again, use `/link`"
  getplayer:
    title: "🎮 Player Information"
    color: D600CB
    message:
      - "**Player Information:**"
      - ""
      - "In-Game Username: `{username}`"
      - "In-Game UUID: `{uuid}`"
      - "Linked Discord: {discord_tag}"
      - "Discord ID: `{discord_id}`"
      - "Link Date: {link_date}"
      - "Recovery Code: `{recovery_code}`"
  rank_sync:
    starting:
      title: "🔄 Syncing ranks..."
      color: DBB000
      message: "Starting synchronization..."
    process:
      title: "🔄 Syncing ranks..."
      color: DBB000
      message: "Progress: **{done}/{total}**"
    done:
      title: "✅ Rank synchronization complete!"
      color: 08C702
      message: "All linked users have been updated successfully."
  ip:
    title: "🎮 Server Information"
    color: D600CB
    message:
      - "**IP:** test.example.com"
      - "**Online Players:** {online_players}"
      - "**Website:** www.example.com"
  stafflist:
    title: "📋 StaffList"
    color: 7202C7
    message:
      - "**There are a total of {total} staff connected**"
      - ""
      - "{staff_list}"
    staff_list: "- {player} ({rank} - {server})"
    no_staff: "❌ There are no staff members connected."
  vlist:
    title: "📋 vList"
    color: 7202C7
    message:
      - "**There are a total of {total} players connected**"
      - ""
      - "{player_list}"
    player_list: "- {identifier} ({num}) - {players}"
    no_players: "❌ There are no players connected."
    usage: "Usage: `/vlist true/false` (true = group by rank, false = group by server)"
  only_server: "❌ This command can only be used on a server."
  no_permission: "🚫 You dont have permission to use that command."
  userinfo_usage: "Usage: `/userinfo <id or mention>`"
  no_user_found: "❌ No user could be found with id: `{userID}`."
  forceunlink_usage: "Usage: `/unlink <id or mention>`"
  forceunlink_no_linked: "⚠️ User `{discordTag}` is not linked."
  unlink_disabled: "🚫 The unlink command is currently disabled, contact and administrator to unlink your account."
  unlink_success: "✅ Your Minecraft account `{username}` has been unlinked."
  unlink_cancelled: "❌ Unlink process cancelled."
  unlink_no_linked: "⚠️ You don't have any linked Minecraft account."
  unlink_wrong_code: "❌ Incorrect security code."
  unlink_require_code: "Enter your security code"
  unlink_confirm_button: "✅ Confirm Unlink with Security Code"
  unlink_confirming: "🔒 Please complete the security check..."
  getplayer_usage: "Usage: `/getplayer <MinecraftName>`"
  getplayer_no_linked: "❌ Minecraft player `{player}` is not linked."
  messaging_no_linked: "❌ Link your minecraft account to send messages on this channel."
  messaging_litebans_banned_or_muted: "❌ You have an active punish ingame, you cannot talk."
  reloadranks_disabled: "❌ The LuckPerms integration is disabled"
  reloadranks_error: "❌ Error: Trying to update your rank."
  reloadranks_current: "❌ You have your current rank already."
  reloadranks_success: "✅ Your Discord roles have been updated according to your in-game rank."
  reloadranks_no_role: "❌ No Discord role is set for your in-game rank."
  velocity_utils_commands_disabled: "❌ This command is disabled"
  alert_usage: "Usage: `/alert <amount> <message>`"
  alert_sent: "✅ Alert sent to all players on the Velocity network."
  staff_admin_chat_no_linked: "❌ You need to link your account to use that command."
  staff_admin_chat_sent: "✅ Message sent to the minecraft chat."
  staff_chat_usage: "Usage: `/staffchat <message>`"
  admin_chat_usage: "Usage: `/adminchat <message>`"
  button_yes: "✅ Yes"
  button_no: "❌ No"

